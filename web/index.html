<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion Supermarché</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>🛒 Supermarché — Gestion des Caisses</h1>
</header>

<section id="controles">
  <div class="control-group">
    <input type="text"   id="nomClient"    placeholder="Nom du client">
    <input type="number" id="nbArticles"   placeholder="Nb articles" min="1">
    <button onclick="ajouterClient()">➕ Ajouter un client</button>
  </div>
  <!-- Zone simulation — séparée des controles -->
  <div id="zone-simulation">
    <h3>Mode Simulation</h3>
    <button onclick="demarrerSimulation()" id="btnDemarrer">
        ▶️ Démarrer simulation
    </button>
    <button onclick="arreterSimulation()" id="btnArreter">
        ⏹️ Arrêter simulation
    </button>
  </div>
  <div class="control-group">
    <input type="number" id="numeroCaisse" placeholder="Numéro caisse">
    <button onclick="servirClient()">✅ Servir prochain client</button>
    <button onclick="ouvrirCaisse()">🟢 Ouvrir caisse</button>
    <button onclick="fermerCaisse()">🔴 Fermer caisse</button>
    <button onclick="fermerCaisseRepartition()" 
        style="background:#8e44ad; color:white; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">
      🔀 Fermer + Redistribuer
    </button>
  </div>
</section>

<section id="grille-caisses"></section>

<section id="historique">
    <h2>Historique des clients servis</h2>
    <ul id="liste-historique"></ul>
</section>
<section id="statistiques">
  Total clients servis : <span id="totalServis">0</span>
</section>
<section id="graphique">
    <h2>Charge par caisse</h2>
    <canvas id="monGraphique" height="120"></canvas>
</section>
<div id="message"></div>

<script src="app.js"></script>
</body>
</html>
